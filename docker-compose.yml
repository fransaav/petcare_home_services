version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: petcare-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PetCare_Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
  rabbitmq:
    image: rabbitmq:3-management
    container_name: petcare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  sqlserver_data:
